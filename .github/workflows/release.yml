name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-python-binary:
    name: PyInstaller — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: companion-bin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: companion-bin.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: companion-bin

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Sync project deps
        # Skip ``voice_local`` extra — it pulls in torch+cu130 which has no
        # macOS-arm64 wheel. Voice transcription is opt-in at runtime and
        # not required for the bundled binary.
        run: uv sync --dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build SvelteKit UI
        # PyInstaller bundles web/build into the frozen binary so the
        # bundled app serves the modern UI. Must run before PyInstaller.
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build Python binary
        run: |
          uv run pyinstaller packaging/companion-bin.spec \
            --distpath packaging/dist \
            --workpath packaging/build \
            --noconfirm
        shell: bash

      - name: Smoke-test binary (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x packaging/dist/companion-bin
          # The binary boots the full FastAPI server when invoked with
          # no args (no --help flag). Wrap in `timeout` so it exits
          # cleanly after we've confirmed it starts; suppress non-zero
          # exit caused by the SIGTERM.
          timeout 8 ./packaging/dist/companion-bin > /tmp/smoke.log 2>&1 || true
          head -20 /tmp/smoke.log
          file packaging/dist/companion-bin

      - name: Upload Python binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-binary-${{ matrix.target }}
          path: packaging/dist/${{ matrix.artifact }}
          retention-days: 1

  build-tauri:
    name: Tauri — ${{ matrix.os }}
    needs: build-python-binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            python-artifact: companion-bin
            bundle-ext: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-artifact: companion-bin.exe
            bundle-ext: exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python-artifact: companion-bin
            bundle-ext: AppImage

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tauri/src-tauri -> target"

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Download Python binary
        uses: actions/download-artifact@v4
        with:
          name: python-binary-${{ matrix.target }}
          path: packaging/dist

      - name: Make binary executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x packaging/dist/companion-bin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build SvelteKit UI
        working-directory: web
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        working-directory: tauri/src-tauri
        run: cargo tauri build --target ${{ matrix.target }}
        env:
          # Auto-updater signing — TAURI_SIGNING_PRIVATE_KEY is set as a
          # repo secret; the matching public key lives in tauri.conf.json.
          # Without these, createUpdaterArtifacts emits unsigned bundles
          # and the desktop client refuses to install them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Empty default lets the unprotected dev key sign without
          # tauri-cli prompting on a non-interactive runner.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: ""

      - name: Upload Tauri bundle (installer)
        uses: actions/upload-artifact@v4
        with:
          name: Companion-${{ github.ref_name }}-${{ matrix.target }}
          path: |
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.${{ matrix.bundle-ext }}
          if-no-files-found: error

      - name: Upload updater artifacts (signed .tar.gz + .sig)
        # The updater pulls these — not the installer — so we publish them
        # alongside the human-downloadable bundles. Glob is permissive so
        # both macOS (.app.tar.gz) and Windows / Linux variants come through.
        uses: actions/upload-artifact@v4
        with:
          name: Companion-updater-${{ github.ref_name }}-${{ matrix.target }}
          path: |
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.tar.gz
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.tar.gz.sig
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.zip
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.zip.sig
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage.sig
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.nsis.zip
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.nsis.zip.sig
          if-no-files-found: warn

  release:
    name: GitHub Release
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          pattern: "Companion-*"
          path: dist
          merge-multiple: true

      - name: Generate updater latest.json manifest
        # The Tauri auto-updater fetches this manifest first to learn the
        # current version + platform-specific download URL + signature.
        # Each `.sig` next to a packaged bundle becomes a platform entry.
        run: |
          python3 .github/scripts/build_latest_json.py \
            --version "${GITHUB_REF_NAME#v}" \
            --repo "${GITHUB_REPOSITORY}" \
            --bundles-dir dist \
            --output dist/latest.json
          cat dist/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Companion ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          files: dist/**/*
          body: |
            ## Companion ${{ github.ref_name }}

            Self-hosted AI workstation — FastAPI proxy, dashboard, background agent loop.

            ### Installation

            | Platform | Download |
            |----------|---------|
            | macOS (Apple Silicon) | `Companion-*-aarch64-apple-darwin.dmg` |
            | Windows (x86-64) | `Companion-*-x86_64-pc-windows-msvc.exe` |
            | Linux (x86-64) | `Companion-*-x86_64-unknown-linux-gnu.AppImage` |

            > **macOS note:** The app is not codesigned in this release. On first launch macOS will refuse to open it; right-click the app and pick **Open**, then confirm. See [docs/installing.md](https://github.com/telaaron/companion/blob/main/docs/installing.md) for details.
