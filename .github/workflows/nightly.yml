name: Nightly

# Nightly channel — auto-built from main every day at 03:00 UTC. Used by
# the bravest testers who want the absolute latest tip. Skipped on days
# when main hasn't moved (no new commits in the last 24 h).
#
# Manifest is written as ``latest-nightly.json`` so the Tauri updater
# can pull this channel independently of stable / beta.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  preflight:
    name: Should we build?
    runs-on: ubuntu-22.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      sha: ${{ steps.diff.outputs.sha }}
      date: ${{ steps.diff.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Check for commits in the last 24h
        run: |
          set -euo pipefail
          since=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || \
                  date -u -v-24H '+%Y-%m-%dT%H:%M:%SZ')
          count=$(git log --since="$since" --oneline | wc -l | tr -d ' ')
          echo "Commits in last 24h: $count"
          if [[ "$count" -gt 0 ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u '+%Y%m%d')" >> $GITHUB_OUTPUT

  build-python-binary:
    name: PyInstaller — ${{ matrix.os }}
    needs: preflight
    if: needs.preflight.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: companion-bin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: companion-bin.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: companion-bin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --dev
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm run build
      - run: |
          uv run pyinstaller packaging/companion-bin.spec \
            --distpath packaging/dist \
            --workpath packaging/build \
            --noconfirm
        shell: bash
      - if: runner.os != 'Windows'
        run: |
          chmod +x packaging/dist/companion-bin
          timeout 8 ./packaging/dist/companion-bin > /tmp/smoke.log 2>&1 || true
          head -20 /tmp/smoke.log
          file packaging/dist/companion-bin
      - uses: actions/upload-artifact@v4
        with:
          name: python-binary-${{ matrix.target }}
          path: packaging/dist/${{ matrix.artifact }}
          retention-days: 1

  build-tauri:
    name: Tauri — ${{ matrix.os }}
    needs: [preflight, build-python-binary]
    if: needs.preflight.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundle-ext: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle-ext: exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle-ext: AppImage
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tauri/src-tauri -> target"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/download-artifact@v4
        with:
          name: python-binary-${{ matrix.target }}
          path: packaging/dist
      - if: runner.os != 'Windows'
        run: chmod +x packaging/dist/companion-bin
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm run build
      - run: cargo install tauri-cli --version "^2" --locked
      - working-directory: tauri/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: ""
        run: cargo tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: Companion-nightly-${{ needs.preflight.outputs.date }}-${{ matrix.target }}
          path: |
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.${{ matrix.bundle-ext }}
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.tar.gz
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.tar.gz.sig
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.zip
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.zip.sig
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage.sig
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.nsis.zip
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.nsis.zip.sig
          if-no-files-found: error

  publish:
    name: Publish nightly release
    needs: [preflight, build-tauri]
    if: needs.preflight.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "Companion-nightly-*"
          path: dist
          merge-multiple: true
      - name: Compute version string
        id: version
        run: |
          # Read the base version + suffix with date + short SHA.
          base=$(grep '^version' tauri/src-tauri/Cargo.toml | head -1 | cut -d '"' -f2)
          ver="${base}-nightly.${{ needs.preflight.outputs.date }}+${{ needs.preflight.outputs.sha }}"
          echo "version=$ver" >> $GITHUB_OUTPUT
          echo "tag=nightly-${{ needs.preflight.outputs.date }}" >> $GITHUB_OUTPUT
      - name: Generate latest-nightly.json
        run: |
          python3 .github/scripts/build_latest_json.py \
            --version "${{ steps.version.outputs.version }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --bundles-dir dist \
            --output dist/latest-nightly.json \
            --notes "Nightly build — auto-generated from main."
          cat dist/latest-nightly.json
      - name: Delete previous nightly release (rolling tag)
        run: |
          gh release delete "${{ steps.version.outputs.tag }}" --yes 2>/dev/null || true
          git push --delete origin "${{ steps.version.outputs.tag }}" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Companion Nightly (${{ needs.preflight.outputs.date }})
          draft: false
          prerelease: true
          generate_release_notes: false
          files: dist/**/*
          body: |
            ## Companion Nightly — ${{ needs.preflight.outputs.date }}

            ⚠️ **Auto-built from `main` at commit
            [`${{ needs.preflight.outputs.sha }}`](https://github.com/telaaron/companion/commit/${{ needs.preflight.outputs.sha }}).**
            Untested and may break on you.

            Use only if you actively help track regressions. Switch
            channels back to `stable` in **Settings → Updates** when
            you're done testing.
