name: Close stale issues + PRs

on:
  schedule:
    # Daily 04:00 UTC.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/stale@v10
        with:
          # Issues: warn at 60 days idle, close at 74 (14 day grace).
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-message: >
            This issue has been inactive for 60 days. It will be closed
            in 14 days if there is no further activity. Drop a comment
            if it's still relevant.
          close-issue-message: >
            Closed due to inactivity. Please reopen with fresh context
            if the problem still exists.
          stale-issue-label: "stale"

          # PRs: warn at 30 days idle, close at 44.
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-message: >
            This pull request has been inactive for 30 days. It will be
            closed in 14 days if there is no further activity. Please
            rebase against main or comment to keep it open.
          close-pr-message: >
            Closed due to inactivity. Feel free to reopen once you have
            time to pick it back up.
          stale-pr-label: "stale"

          # Never auto-close issues that maintainers want to keep alive.
          exempt-issue-labels: "pinned,security,roadmap,help-wanted,good-first-issue"
          exempt-pr-labels: "pinned,security"

          # Keep the bot polite — don't spam reactions.
          remove-stale-when-updated: true
          remove-issue-stale-when-updated: true
          remove-pr-stale-when-updated: true
          operations-per-run: 50
