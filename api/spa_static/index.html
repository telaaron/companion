<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Free Claude Code</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/app/assets/shell.css" />
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">FC</div>
          <div class="brand-meta">
            <strong>free-claude-code</strong>
            <span class="status-pill ok" id="serverStatus">online</span>
          </div>
        </div>

        <nav class="side-nav" aria-label="Primary">
          <div class="nav-group">
            <div class="nav-group-label">Workspace</div>
            <a class="nav-link" data-route="/app/" data-icon="◇">Home</a>
            <a class="nav-link" data-route="/app/chat" data-icon="◈">Chat</a>
            <a class="nav-link" data-route="/app/projects" data-icon="▤">Projects</a>
          </div>
          <div class="nav-group">
            <div class="nav-group-label">Activity</div>
            <a class="nav-link" data-route="/app/usage" data-icon="↗">Usage</a>
            <a class="nav-link" data-route="/app/files" data-icon="≡">File edits</a>
            <a class="nav-link" data-route="/app/audit" data-icon="◉">Audit log</a>
          </div>
          <div class="nav-group">
            <div class="nav-group-label">Admin</div>
            <a class="nav-link" data-route="/app/skills" data-icon="★">Skills</a>
            <a class="nav-link" data-route="/app/settings" data-icon="⚙">Settings</a>
          </div>
        </nav>

        <div class="sidebar-footer">
          <div class="footer-row">
            <span class="muted">Cost today</span>
            <strong id="costToday">—</strong>
          </div>
          <button id="themeToggle" class="ghost-button" type="button">Toggle theme</button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb" id="breadcrumb">Home</div>
          <div class="topbar-actions">
            <button id="paletteOpen" class="ghost-button" type="button">
              <span>Search</span> <kbd>⌘K</kbd>
            </button>
            <a href="/app/settings" class="ghost-button" title="Settings">⚙</a>
          </div>
        </header>

        <section class="page" id="page" aria-live="polite"></section>

        <footer class="page-footer">
          <span class="muted">localhost · loopback only</span>
          <span class="muted" id="versionTag"></span>
        </footer>
      </main>
    </div>

    <div class="palette-overlay hidden" id="palette" role="dialog" aria-modal="true">
      <div class="palette-card">
        <input id="paletteInput" type="text" placeholder="Type a page or action…" autocomplete="off" />
        <ul class="palette-results" id="paletteResults"></ul>
        <div class="palette-hint muted">↑↓ navigate · ↵ go · esc close</div>
      </div>
    </div>

    <div class="toast-stack" id="toasts"></div>

    <script type="module" src="/app/assets/shell.js"></script>
  </body>
</html>
