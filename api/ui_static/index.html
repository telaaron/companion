<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>Companion</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="vendor/prism/prism-tomorrow.css" />
<link rel="stylesheet" href="vendor/prism/prism-line-numbers.css" />
<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0a0b'/%3E%3Ccircle cx='50' cy='50' r='22' fill='none' stroke='%236366f1' stroke-width='5.5'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%236366f1'/%3E%3C/svg%3E"
/>
</head>
<body>
<div id="app" class="app">

  <!-- ============================================================ Sidebar nav -->
  <nav id="nav" class="nav" aria-label="Primary">
    <header class="nav-header">
      <div class="brand">
        <div class="brand-text">
          <div class="brand-name">Companion</div>
          <div class="brand-tag" id="brand-status">online</div>
        </div>
      </div>
    </header>

    <div class="nav-section">
      <button class="nav-item active" data-route="chat">
        <i data-lucide="message-circle" class="nav-icon"></i> Chat
      </button>
      <button class="nav-item" data-route="projects">
        <i data-lucide="folder-git-2" class="nav-icon"></i> Projects
      </button>
      <button class="nav-item" data-route="usage">
        <i data-lucide="trending-up" class="nav-icon"></i> Usage
      </button>
      <button class="nav-item" data-route="files">
        <i data-lucide="file-pen-line" class="nav-icon"></i> File edits
      </button>
      <button class="nav-item" data-route="audit">
        <i data-lucide="clipboard-list" class="nav-icon"></i> Audit log
      </button>
      <button class="nav-item" data-route="env">
        <i data-lucide="key" class="nav-icon"></i> Env vault
      </button>
      <button class="nav-item" data-route="root">
        <i data-lucide="folder-tree" class="nav-icon"></i> Root files
      </button>
      <button class="nav-item" data-route="skills">
        <i data-lucide="sparkles" class="nav-icon"></i> Skills
      </button>
      <button class="nav-item" data-route="memory">
        <i data-lucide="brain" class="nav-icon"></i> Memory
      </button>
      <button class="nav-item" data-route="routines">
        <i data-lucide="clock" class="nav-icon"></i> Routines
      </button>
      <button class="nav-item" data-route="insights">
        <i data-lucide="lightbulb" class="nav-icon"></i> Insights
      </button>
      <button class="nav-item" data-route="settings">
        <i data-lucide="settings" class="nav-icon"></i> Settings
      </button>
    </div>

    <footer class="nav-footer">
      <div class="metric">
        <div class="metric-label">today</div>
        <div class="metric-value" id="metric-today">$0.00</div>
      </div>
      <div class="metric">
        <div class="metric-label">7d</div>
        <div class="metric-value" id="metric-week">$0.00</div>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">
        <span id="theme-toggle-label">dark</span>
      </button>
    </footer>
  </nav>

  <!-- ============================================================ Main view -->
  <main id="view" class="view"></main>

</div>

<script src="vendor/lucide/lucide.min.js"></script>
<script src="app.js"></script>
</body>
</html>
