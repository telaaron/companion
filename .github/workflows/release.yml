name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-python-binary:
    name: PyInstaller — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: companion-bin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: companion-bin.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: companion-bin

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Sync project deps
        run: uv sync --all-extras --dev

      - name: Build Python binary
        run: |
          uv run pyinstaller packaging/companion-bin.spec \
            --distpath packaging/dist \
            --workpath packaging/build \
            --noconfirm
        shell: bash

      - name: Smoke-test binary (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x packaging/dist/companion-bin
          ./packaging/dist/companion-bin --help 2>&1 | head -3 || true
          file packaging/dist/companion-bin

      - name: Upload Python binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-binary-${{ matrix.target }}
          path: packaging/dist/${{ matrix.artifact }}
          retention-days: 1

  build-tauri:
    name: Tauri — ${{ matrix.os }}
    needs: build-python-binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            python-artifact: companion-bin
            bundle-ext: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-artifact: companion-bin.exe
            bundle-ext: exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python-artifact: companion-bin
            bundle-ext: AppImage

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tauri/src-tauri -> target"

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Download Python binary
        uses: actions/download-artifact@v4
        with:
          name: python-binary-${{ matrix.target }}
          path: packaging/dist

      - name: Make binary executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x packaging/dist/companion-bin

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        working-directory: tauri/src-tauri
        run: cargo tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          APPLE_SIGNING_IDENTITY: ""

      - name: Upload Tauri bundle
        uses: actions/upload-artifact@v4
        with:
          name: Companion-${{ github.ref_name }}-${{ matrix.target }}
          path: |
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.${{ matrix.bundle-ext }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          pattern: "Companion-*"
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Companion ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          files: dist/**/*
          body: |
            ## Companion ${{ github.ref_name }}

            Self-hosted AI workstation — FastAPI proxy, dashboard, background agent loop.

            ### Installation

            | Platform | Download |
            |----------|---------|
            | macOS (Apple Silicon) | `Companion-*-aarch64-apple-darwin.dmg` |
            | Windows (x86-64) | `Companion-*-x86_64-pc-windows-msvc.exe` |
            | Linux (x86-64) | `Companion-*-x86_64-unknown-linux-gnu.AppImage` |

            > **macOS note:** The app is not codesigned in this release. On first launch macOS will refuse to open it; right-click the app and pick **Open**, then confirm. See [docs/installing.md](https://github.com/telaaron/companion/blob/main/docs/installing.md) for details.
